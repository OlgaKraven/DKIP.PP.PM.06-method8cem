<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пульт сопровождения</title><style>body{font:18px/1.5 Arial;max-width:900px;margin:35px auto;padding:0 20px;color:#20232b}h1{font-size:30px}section{padding:20px;background:#f4f4f6;margin:20px 0;border-radius:10px}button,input{font:inherit;padding:8px;margin:5px}pre{background:white;padding:15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;border:1px solid #ccc}a{color:#1549a0}label{display:block}</style><h1>Пульт сопровождения</h1><p id="context"></p><section><h2>Запрос к работающей системе</h2><label>Конечная дата включительно (YYYY-MM-DD): <input id="end" placeholder="Оставить пустым для всех записей"></label><button id="send">Отправить запрос</button><button id="health">Проверить готовность</button><pre id="out">Запрос ещё не отправлен</pre></section><section><h2>Журнал работы</h2><p>Регистрировать события в момент действия. Кнопки сохраняют фактическое UTC-время.</p><button data-event="detected">Инцидент обнаружен</button><button data-event="acknowledged">Работа принята</button><button data-event="change_started">Изменение начато</button><button data-event="restored">Работа восстановлена</button><button data-event="confirmed">Результат подтверждён</button><p id="event"></p><a href="/ops/events" target="_blank">Открыть журнал событий</a></section><script>let out=document.querySelector('#out');async function query(path){let r=await fetch(path);let text=await r.text();out.textContent='GET '+path+'\nHTTP '+r.status+'\n'+text;}document.querySelector('#send').onclick=()=>query('/api/records'+(document.querySelector('#end').value?'?end='+encodeURIComponent(document.querySelector('#end').value):''));document.querySelector('#health').onclick=()=>query('/health');document.querySelectorAll('[data-event]').forEach(b=>b.onclick=async()=>{let r=await fetch('/ops/event/'+b.dataset.event,{method:'POST'});document.querySelector('#event').textContent=await r.text();});fetch('/api/context').then(r=>r.json()).then(c=>document.querySelector('#context').textContent='Вариант '+c.variant+' — '+c.domain+'. Контрольная дата: '+c.end+'. Исходные ID: '+c.ids.join(', '));</script></html>
